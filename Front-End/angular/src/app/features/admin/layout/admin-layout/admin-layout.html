<div class="admin-shell">
  <aside class="admin-sidebar">
    <a class="brand" routerLink="/admin/dashboard">
      <span class="brand-mark">A</span>
      <span>
        <strong>Appointment</strong>
        <small>Administration</small>
      </span>
    </a>

    <p class="nav-label">WORKSPACE</p>
    <nav aria-label="Administration">
      <a routerLink="/admin/dashboard" routerLinkActive="active">
        <span aria-hidden="true">▦</span>
        Overview
      </a>
      <a routerLink="/admin/appointments" routerLinkActive="active">
        <span aria-hidden="true">▣</span>
        Appointments
      </a>
      <a routerLink="/admin/branches" routerLinkActive="active">
        <span aria-hidden="true">⌖</span>
        Branches
      </a>
      <a routerLink="/admin/services" routerLinkActive="active">
        <span aria-hidden="true">▤</span>
        Services
      </a>
    </nav>

    <button class="logout-button" type="button" (click)="signOut()">
      <span aria-hidden="true">↪</span>
      Sign out
    </button>
  </aside>

  <div class="admin-main">
    <router-outlet />
  </div>
