spring.application.name=appointment-service
server.port=8082
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Configure these environment variables in the run configuration.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appointment_booking}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dev-user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Set JWT_SECRET to a random value of at least 32 bytes.
app.jwt.secret=${JWT_SECRET}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
