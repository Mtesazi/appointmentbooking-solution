spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=appointment-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://appointment-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/**,/swagger-ui.html,/swagger-ui/**,/v3/api-docs/**
