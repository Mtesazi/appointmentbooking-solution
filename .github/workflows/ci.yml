name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Angular tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front-End/angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: Front-End/angular/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: appointment_booking_test
          POSTGRES_USER: appointment_test
          POSTGRES_PASSWORD: appointment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appointment_test -d appointment_booking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/appointment_booking_test
      SPRING_DATASOURCE_USERNAME: appointment_test
      SPRING_DATASOURCE_PASSWORD: appointment_test
      JWT_SECRET: ci-only-test-secret-at-least-32-bytes-long
      BOOKING_INTEGRATION_TEST: 'true'
      EUREKA_CLIENT_ENABLED: 'false'
      SPRING_CLOUD_DISCOVERY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            Back-End/appointment-service/pom.xml
            Back-End/api-gateway/pom.xml
            Back-End/service-discovery/pom.xml
      - name: Appointment service tests
        working-directory: Back-End/appointment-service
        run: ./mvnw --batch-mode --no-transfer-progress test
      - name: Gateway tests
        working-directory: Back-End/api-gateway
        run: ../appointment-service/mvnw --batch-mode --no-transfer-progress test
      - name: Compile service discovery
        working-directory: Back-End/service-discovery
        run: ../appointment-service/mvnw --batch-mode --no-transfer-progress test
